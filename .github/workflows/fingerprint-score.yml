name: fingerprint-score

# 指纹评分流水线: PR / main 推送 / 每日定时自动跑, 也可手动触发.
# 1) gate-unit  门禁抽取器单测, 不开网站, 失败即阻断
# 2) audit      fingerprint-audit 自检, 红 (2) 阻断, 黄 (1) 警告, 跑不起来记为未评分
# 3) sites      公开检测站实采 (接真实副本 CDP) + 评分卡, 只记录不阻断 (检测站与 runner 出口 IP 不受我们控制)
# sites 的最后一步把评分卡发到 PR 评论 / 步骤摘要, 让人不点进 run 也能看到那张 SVG
on:
    pull_request:
        paths:
            - "packages/browser/**"
            - "packages/fingerprint/**"
            - "packages/fingerprint-audit/**"
            - "scripts/publish-scorecard.sh"
            - ".github/workflows/fingerprint-score.yml"
    push:
        branches: [main]
    schedule:
        - cron: "0 19 * * *" # 03:00 Asia/Shanghai
    workflow_dispatch:
        inputs:
            pr:
                description: 把这次测评记到哪个 PR 号下 (留空只更新 latest 图, 不写 data)
                required: false
                default: ""

permissions:
    contents: read

concurrency:
    group: fp-score-${{ github.ref }}
    cancel-in-progress: true

jobs:
    gate-unit:
        name: 门禁抽取器单测
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: engine tests
              run: node --experimental-strip-types --test packages/browser/tests/noise.test.mjs packages/browser/gate/engine.test.ts packages/browser/gate/claude-env.test.ts

    audit:
        name: 指纹自检 (audit · 真实 hx-browser 副本)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v4
            - name: browser deps (fontconfig, chrome)
              run: |
                  sudo apt-get update -qq && sudo apt-get install -y -qq fontconfig
                  google-chrome-stable --version || echo "::warning::runner 上没有 google-chrome-stable"
            - name: start real profile
              id: up
              working-directory: packages/browser
              run: |
                  set +e
                  uv run python gate/real_profile.py up --spawn
                  code=$?
                  echo "up_exit=$code" >> "$GITHUB_OUTPUT"
                  if [ "$code" != "0" ]; then
                      echo "::warning::真实副本没拉起来 (exit $code), audit 记为未评分"
                      tail -n 80 "$RUNNER_TEMP/hx-browser-api.log" || true
                  fi
                  exit 0
            - name: fingerprint audit
              id: audit
              working-directory: packages/fingerprint-audit
              env:
                  CDP: ${{ steps.up.outputs.cdp }}
                  UP: ${{ steps.up.outputs.up_exit }}
              run: |
                  set +e
                  if [ "$UP" != "0" ] || [ -z "$CDP" ]; then
                      echo "exit_code=3" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  uv run audit.py --endpoint "$CDP" --label ci-real-profile --json > "$RUNNER_TEMP/score.json" 2> "$RUNNER_TEMP/score.err"
                  code=$?
                  cat "$RUNNER_TEMP/score.json" || true
                  cat "$RUNNER_TEMP/score.err" || true
                  echo "exit_code=$code" >> "$GITHUB_OUTPUT"
                  exit 0
            - name: stop real profile
              if: always()
              working-directory: packages/browser
              run: uv run python gate/real_profile.py down
            - name: judge by score
              env:
                  CODE: ${{ steps.audit.outputs.exit_code }}
              run: |
                  echo "fingerprint audit exit code: $CODE (0 green / 1 yellow / 2 red / 3 unscored)"
                  echo "## 指纹自检 (真实副本): exit $CODE (0 绿 / 1 黄 / 2 红 / 3 未评分)" >> "$GITHUB_STEP_SUMMARY"
                  case "$CODE" in
                      0) ;;
                      1) echo "::warning::fingerprint audit is yellow, needs human review" ;;
                      2) echo "::error::fingerprint audit failed (red), blocking"; exit 1 ;;
                      *) echo "::warning::audit 未能运行 (exit $CODE), 视为未评分而不是失败" ;;
                  esac
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: fingerprint-audit
                  path: |
                      ${{ runner.temp }}/score.json
                      ${{ runner.temp }}/score.err
                      ${{ runner.temp }}/hx-browser-api.log
                  if-no-files-found: warn

    claude-env:
        name: Claude 环境评分 (对齐 NodeCloak, 高风险阻断)
        needs: gate-unit
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: install chromium
              working-directory: packages/browser
              run: uv run --with playwright playwright install --with-deps chromium
            - name: probe
              working-directory: packages/browser
              run: uv run --with playwright python gate/claude_env_probe.py --out "$RUNNER_TEMP/claude-env.json"
            - name: score (0 low / 1 medium / 2 high)
              run: |
                  set +e
                  node --experimental-strip-types packages/browser/gate/claude-env.ts "$RUNNER_TEMP/claude-env.json" | tee "$RUNNER_TEMP/claude-env.txt"
                  code=${PIPESTATUS[0]}
                  { echo "## Claude 环境评分 (FuckClaude 信号, 越低越好)"; sed 's/^/    /' "$RUNNER_TEMP/claude-env.txt"; } >> "$GITHUB_STEP_SUMMARY"
                  case "$code" in
                      0) ;;
                      1) echo "::warning::claude env medium risk, needs review" ;;
                      *) echo "::error::claude env high risk (exit $code), blocking"; exit 1 ;;
                  esac
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: claude-env
                  path: ${{ runner.temp }}/claude-env.*
                  if-no-files-found: warn

    claude-env-profile:
        name: Claude 环境评分 · 真实 hx-browser 副本 (--cdp, 高风险阻断)
        needs: gate-unit
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: browser deps (fontconfig, chrome)
              run: |
                  sudo apt-get update -qq && sudo apt-get install -y -qq fontconfig
                  google-chrome-stable --version || echo "::warning::runner 上没有 google-chrome-stable"
            - name: start real profile
              id: up
              working-directory: packages/browser
              run: |
                  set +e
                  uv run python gate/real_profile.py up --spawn
                  code=$?
                  echo "up_exit=$code" >> "$GITHUB_OUTPUT"
                  if [ "$code" != "0" ]; then
                      echo "::warning::真实副本没拉起来 (exit $code), 本 job 记为未评分"
                      tail -n 80 "$RUNNER_TEMP/hx-browser-api.log" || true
                  fi
                  exit 0
            - name: probe via CDP
              if: steps.up.outputs.up_exit == '0'
              working-directory: packages/browser
              env:
                  CDP: ${{ steps.up.outputs.cdp }}
              run: uv run --with playwright python gate/claude_env_probe.py --cdp "$CDP" --out "$RUNNER_TEMP/claude-env-profile.json"
            - name: score (0 low / 1 medium / 2 high)
              if: steps.up.outputs.up_exit == '0'
              run: |
                  set +e
                  node --experimental-strip-types packages/browser/gate/claude-env.ts "$RUNNER_TEMP/claude-env-profile.json" | tee "$RUNNER_TEMP/claude-env-profile.txt"
                  code=${PIPESTATUS[0]}
                  { echo "## Claude 环境评分 · 真实 hx-browser 副本 (越低越好)"; sed 's/^/    /' "$RUNNER_TEMP/claude-env-profile.txt"; } >> "$GITHUB_STEP_SUMMARY"
                  case "$code" in
                      0) ;;
                      1) echo "::warning::real profile claude env medium risk, needs review" ;;
                      *) echo "::error::real profile claude env high risk (exit $code), blocking"; exit 1 ;;
                  esac
            - name: stop real profile
              if: always()
              working-directory: packages/browser
              run: uv run python gate/real_profile.py down
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: claude-env-profile
                  path: |
                      ${{ runner.temp }}/claude-env-profile.*
                      ${{ runner.temp }}/hx-browser-api.log
                  if-no-files-found: warn

    sites:
        name: 公开检测站实采 (${{ matrix.kernel }}, 只记录)
        needs: gate-unit
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                kernel: [cloak, chrome, chromium, edge, brave, firefox, librewolf, safari]
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v4
            - name: browser deps (fontconfig)
              run: sudo apt-get update -qq && sudo apt-get install -y -qq fontconfig

            # 只给当前内核装它自己的浏览器. 装不上不算失败: 后面的 real_profile.py
            # 会探测不到可执行文件而返回 STATUS=not_installed, 记未测而不是 0 分.
            - name: install kernel (${{ matrix.kernel }})
              id: kernel
              continue-on-error: true
              env:
                  KERNEL: ${{ matrix.kernel }}
              run: |
                  set +e
                  case "$KERNEL" in
                      chrome)
                          which google-chrome-stable >/dev/null && echo "runner 自带 google-chrome-stable" ;;
                      chromium)
                          sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium ;;
                      edge)
                          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
                              | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft.gpg >/dev/null \
                              && echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/edge stable main" \
                              | sudo tee /etc/apt/sources.list.d/microsoft-edge.list >/dev/null \
                              && sudo apt-get update -qq && sudo apt-get install -y -qq microsoft-edge-stable ;;
                      brave)
                          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg \
                              https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg \
                              && echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" \
                              | sudo tee /etc/apt/sources.list.d/brave-browser-release.list >/dev/null \
                              && sudo apt-get update -qq && sudo apt-get install -y -qq brave-browser ;;
                      librewolf)
                          sudo apt-get install -y -qq extrepo \
                              && sudo extrepo enable librewolf \
                              && sudo apt-get update -qq && sudo apt-get install -y -qq librewolf ;;
                      firefox)
                          sudo apt-get install -y -qq firefox || true ;;
                      cloak|safari)
                          echo "内核 $KERNEL 不走包管理器" ;;
                      *)
                          echo "未知内核 $KERNEL" ;;
                  esac
                  exit 0

            # 装没装上一眼可见: 每个内核打印自己的真实版本号, 拿不到就明确写没装上
            - name: verify kernel (${{ matrix.kernel }})
              env:
                  KERNEL: ${{ matrix.kernel }}
              run: |
                  set +e
                  case "$KERNEL" in
                      chrome) BIN=google-chrome-stable ;;
                      chromium) BIN=$(which chromium || which chromium-browser) ;;
                      edge) BIN=microsoft-edge-stable ;;
                      brave) BIN=brave-browser ;;
                      librewolf) BIN=librewolf ;;
                      firefox) BIN=firefox ;;
                      *) BIN="" ;;
                  esac
                  if [ -n "$BIN" ] && command -v "$BIN" >/dev/null 2>&1; then
                      echo "内核 $KERNEL 可用: $("$BIN" --version 2>&1 | head -n 1)"
                  else
                      echo "::warning::内核 $KERNEL 没有可执行文件, 这次会记为未测"
                  fi
                  exit 0

            - name: start real profile
              id: up
              working-directory: packages/browser
              run: |
                  set +e
                  uv run python gate/real_profile.py up --spawn --kernel "${{ matrix.kernel }}"
                  code=$?
                  [ "$code" = "0" ] || { echo "::warning::内核 ${{ matrix.kernel }} 没拉起来 (exit $code), 记为未安装或未评分"; tail -n 80 "$RUNNER_TEMP/hx-browser-api.log" || true; }
                  exit 0
            - name: capture checker pages
              working-directory: packages/browser
              env:
                  KERNEL: ${{ matrix.kernel }}
                  STATUS: ${{ steps.up.outputs.status }}
                  FAMILY: ${{ steps.up.outputs.family }}
                  CDP: ${{ steps.up.outputs.cdp }}
              run: |
                  set +e
                  OUT="$RUNNER_TEMP/sites-$KERNEL.json"
                  PROBE=(uv run --with playwright python gate/probe.py --kernel "$KERNEL" --family "$FAMILY" --out "$OUT")
                  case "$STATUS" in
                      ok) "${PROBE[@]}" --cdp "$CDP" || "${PROBE[@]}" --unmeasured "采集器异常退出, 未评分" ;;
                      no_cdp) "${PROBE[@]}" --family webkit ;;
                      not_installed) "${PROBE[@]}" --unmeasured "runner 上没有这个内核, 未安装" ;;
                      *) "${PROBE[@]}" --unmeasured "真实副本没起来, 未评分" ;;
                  esac
                  exit 0
            - name: stop real profile
              if: always()
              working-directory: packages/browser
              run: uv run python gate/real_profile.py down
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: sites-${{ matrix.kernel }}
                  path: |
                      ${{ runner.temp }}/sites-${{ matrix.kernel }}.json
                      ${{ runner.temp }}/hx-browser-api.log
                  if-no-files-found: warn

    sites-report:
        name: 公开检测站评分卡 (按内核出图, 只记录)
        needs: sites
        if: always()
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: actions/download-artifact@v4
              continue-on-error: true
              with:
                  pattern: sites-*
                  path: ${{ runner.temp }}/captures
                  merge-multiple: true
            - name: score every kernel
              run: |
                  set +e
                  node --experimental-strip-types packages/browser/gate/score.ts --bundle "$RUNNER_TEMP/kernels.json" \
                      --expect cloak,chrome,chromium,edge,brave,firefox,librewolf,safari "$RUNNER_TEMP"/captures/sites-*.json
                  node --experimental-strip-types packages/browser/gate/score.ts --no-fail "$RUNNER_TEMP/kernels.json" "$RUNNER_TEMP/scorecards" | tee "$RUNNER_TEMP/score.txt"
                  exit 0
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: fingerprint-sites
                  path: |
                      ${{ runner.temp }}/kernels.json
                      ${{ runner.temp }}/scorecards
                      ${{ runner.temp }}/score.txt
                  if-no-files-found: warn
            - name: publish scorecards
              # 只记录, 发不出去 (例如 fork PR 只读 token) 不能把 job 弄红
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SVG_DIR: ${{ runner.temp }}/scorecards
                  BUNDLE: ${{ runner.temp }}/kernels.json
                  TXT: ${{ runner.temp }}/score.txt
                  PR: ${{ github.event.pull_request.number || inputs.pr }}
              run: bash scripts/publish-scorecard.sh
