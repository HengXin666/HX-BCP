[project]
name = "bcp-lane"
version = "0.1.0"
description = "人机双通道准入判定: 人类通道要本机令牌, Agent 通道要项目名"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bcp-lane = 'lane:main'

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
