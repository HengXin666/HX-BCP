[project]
name = "hx-browser"
version = "0.1.0"
description = "HX-Browser: Linux web-service browser environment manager with CDP endpoints for Python crawler frameworks"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=15.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "markdown>=3.5",
]

[project.optional-dependencies]
# crypto for account-pack password encryption
crypto = ["cryptography>=42.0"]

[dependency-groups]
dev = ["pytest>=8.0", "playwright>=1.45", "selenium>=4.20", "drissionpage>=4.0"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hx_browser"]
