[project]
name = "fp-audit"
version = "0.2.0"
description = "指纹环境质检红线: 对任意浏览器环境跑 creepjs/browserleaks/amiunique/pixelscan 一致性质检"
requires-python = ">=3.11"
dependencies = ["websocket-client>=1.8"]

[project.scripts]
fp-audit = "audit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["audit.py", "rules.py", "fp_ab.py", "diversity.py", "probes/"]

[tool.uv]
package = true
