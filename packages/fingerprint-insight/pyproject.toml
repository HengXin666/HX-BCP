[project]
name = "fp-insight"
version = "0.2.0"
description = "浏览器指纹探测工具: Hook 全部指纹 API, 实时回传站点采集行为 (调用参数/堆栈/调用次数) + 变量纠察"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "playwright>=1.49",
]

[project.scripts]
fp-insight = "fpinsight.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fpinsight"]

[tool.uv]
package = true
